<!doctype html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReelStar — Mockup Pengaturan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf7f2; --surface:#ffffff; --sand:#f3efe8;
    --ink:#1f1d1a; --ink2:#57524a; --muted:#6b665e;
    --line:#e6dfd3; --line2:#d4cbbb; --line3:#bfb5a4;
    --accent:#c93a1b; --accent-dark:#9e2c13; --accent-soft:#fff6f2;
    --sun:#ffc93c; --sun-soft:#fff1c7; --sun-ink:#6b4e00;
    --ok-soft:#e1f0dd; --ok-ink:#25572b;
    --info-soft:#e3ecf8; --info-ink:#1e4a7a;
    --bad-soft:#fbe3e1; --bad-ink:#8a1f14;
    --shadow-ink:2px 2px 0 #1f1d1a;
    --shadow-ink-md:3px 3px 0 #1f1d1a;
    --shadow-ink-lg:4px 4px 0 #1f1d1a;
    --font-sans:'Plus Jakarta Sans', system-ui, 'Segoe UI', sans-serif;
    --font-display:'Bricolage Grotesque', 'Segoe UI', sans-serif;
    --font-mono:'JetBrains Mono', ui-monospace, Consolas, monospace;
  }
  [data-theme="dark"]{
    --paper:#141311; --surface:#1e1c19; --sand:#282521;
    --ink:#f5f2eb; --ink2:#aba296; --muted:#8d857a;
    --line:#2f2a24; --line2:#403931; --line3:#5a5145;
    --accent:#e24a24; --accent-dark:#b83818; --accent-soft:#2d1914;
    --sun:#f6c035; --sun-soft:#32270e; --sun-ink:#fee085;
    --ok-soft:#152a1a; --ok-ink:#76df88;
    --info-soft:#13253b; --info-ink:#7eb7f5;
    --bad-soft:#381614; --bad-ink:#f87171;
    --shadow-ink:2px 2px 0 #080706;
    --shadow-ink-md:3px 3px 0 #080706;
    --shadow-ink-lg:4px 4px 0 #080706;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:transparent}
  body{font-family:var(--font-sans);color:var(--ink);-webkit-font-smoothing:antialiased}
  button{font-family:inherit;color:inherit}
  .i{width:18px;height:18px;flex:none;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .i.sm{width:14px;height:14px}
  .i.lg{width:20px;height:20px}

  .app{
    height:980px;display:flex;flex-direction:column;background:var(--paper);
    border:1.5px solid var(--ink);border-radius:20px;overflow:hidden;
    box-shadow:var(--shadow-ink-lg);
  }

  /* ---------- top bar ---------- */
  .topbar{height:68px;flex:none;display:flex;align-items:center;gap:14px;padding:0 26px;border-bottom:1px solid var(--line);background:var(--surface)}
  .brand{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:800;font-size:19px;letter-spacing:-.02em}
  .brand .mark{width:26px;height:26px;border-radius:8px;background:var(--accent);border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;box-shadow:var(--shadow-ink)}
  .crumb{color:var(--line3);font-size:18px}
  .crumb-title{font-weight:600;font-size:15px}
  .spacer{flex:1}
  .ghost-btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:11px;border:1px solid var(--line2);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer;transition:.15s}
  .ghost-btn:hover{border-color:var(--ink2);background:var(--paper)}
  .theme-seg{display:inline-flex;gap:2px;padding:3px;border-radius:12px;border:1px solid var(--line);background:var(--sand)}
  .theme-seg button{width:34px;height:30px;border:0;border-radius:9px;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink2)}
  .theme-seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}

  /* ---------- shell ---------- */
  .shell{flex:1;min-height:0;display:grid;grid-template-columns:246px 292px minmax(0,1fr)}
  .shell.no-rail{grid-template-columns:246px minmax(0,1fr)}
  .shell.no-rail .rail{display:none}

  /* ---------- sidebar ---------- */
  .sidebar{border-right:1px solid var(--line);padding:22px 14px;overflow-y:auto}
  .nav-group{display:flex;flex-direction:column;gap:2px;margin-bottom:22px}
  .nav-label{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:0 12px 8px}
  .nav-item{display:flex;align-items:center;gap:11px;height:42px;padding:0 12px;border-radius:11px;border:0;background:transparent;font-size:14.5px;font-weight:600;color:var(--ink);cursor:pointer;text-align:left;width:100%;transition:.14s}
  .nav-item:hover{background:var(--sand)}
  .nav-item[aria-current="page"]{background:var(--ink);color:var(--paper)}
  .nav-item .i{opacity:.85}
  .nav-item .warn{margin-left:auto;color:var(--sun-ink)}
  .nav-item[aria-current="page"] .warn{color:var(--sun)}

  /* ---------- provider rail ---------- */
  .rail{border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
  .rail-head{padding:20px 18px 12px}
  .rail-head h2{margin:0;font-size:13px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
  .rail-head p{margin:6px 0 0;font-size:12.5px;color:var(--ink2);line-height:1.45}
  .rail-list{padding:0 10px 10px;overflow-y:auto;flex:1}
  .rail-item{display:flex;align-items:center;gap:11px;width:100%;padding:10px;border-radius:12px;border:1.5px solid transparent;background:transparent;cursor:pointer;text-align:left;margin-bottom:3px;transition:.14s}
  .rail-item:hover{background:var(--sand)}
  .rail-item[aria-selected="true"]{border-color:var(--ink);background:var(--sun-soft);box-shadow:var(--shadow-ink)}
  .logo{width:36px;height:36px;flex:none;border-radius:10px;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:15px;line-height:1;overflow:hidden}
  .logo.lg{width:56px;height:56px;border-radius:16px;font-size:22px}
  .rail-text{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
  .rail-name{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rail-sub{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rail-divider{display:flex;align-items:center;gap:8px;margin:14px 12px 8px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .rail-divider::after{content:"";flex:1;height:1px;background:var(--line)}
  .rail-add{display:flex;align-items:center;gap:9px;width:calc(100% - 20px);margin:2px 10px 14px;padding:10px 11px;border-radius:11px;border:1.5px dashed var(--line3);background:transparent;color:var(--ink2);font-size:14px;font-weight:600;cursor:pointer;transition:.14s}
  .rail-add:hover{border-color:var(--ink2);background:var(--sand);color:var(--ink)}

  /* ---------- badges ---------- */
  .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
  .badge.ok{background:var(--ok-soft);color:var(--ok-ink)}
  .badge.saved{background:var(--info-soft);color:var(--info-ink)}
  .badge.none{background:var(--sand);color:var(--ink2)}
  .badge.bad{background:var(--bad-soft);color:var(--bad-ink)}

  /* ---------- detail ---------- */
  .detail{overflow-y:auto;min-width:0}
  .detail-inner{max-width:820px;padding:30px 40px 60px;display:flex;flex-direction:column;gap:16px}
  .detail-head{display:flex;align-items:flex-start;gap:15px;padding-bottom:4px}
  .detail-head .titles{flex:1;min-width:0}
  .detail-head h1{margin:0;font-family:var(--font-display);font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
  .detail-head p{margin:5px 0 0;font-size:14px;color:var(--ink2);line-height:1.5;max-width:560px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:15px}
  .card h3{margin:0;font-size:14px;font-weight:800}
  .card .sub{margin:-8px 0 0;font-size:13px;color:var(--ink2);line-height:1.5}
  .field{display:flex;flex-direction:column;gap:6px;min-width:0}
  .field > label{font-size:13px;font-weight:700}
  .field .hint{font-size:12.5px;color:var(--muted);line-height:1.45}
  .input{height:44px;width:100%;border-radius:11px;border:1px solid var(--line2);background:var(--surface);padding:0 13px;font-size:14.5px;color:var(--ink);display:flex;align-items:center;gap:9px;outline:none}
  .input.mono{font-family:var(--font-mono);font-size:13px}
  .input.readonly{background:var(--paper);cursor:default}
  .input .i{color:var(--muted)}
  .input .val{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .input .eye{border:0;background:transparent;display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;cursor:pointer;color:var(--muted)}
  .input .eye:hover{background:var(--sand);color:var(--ink)}
  .row{display:flex;align-items:flex-end;gap:8px}
  .row .field{flex:1}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:44px;padding:0 15px;border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;transition:.14s;border:1px solid var(--line2);background:var(--surface);color:var(--ink)}
  .btn:hover{border-color:var(--ink2);background:var(--paper)}
  .btn.accent{border:1.5px solid var(--accent);background:var(--accent-soft);color:var(--accent-dark)}
  .btn.accent:hover{background:#fff}
  .btn.icon{width:44px;padding:0;color:var(--bad-ink)}
  .btn.primary{border:1.5px solid var(--ink);background:var(--accent);color:#fff;box-shadow:var(--shadow-ink)}
  .btn.primary:hover{background:var(--accent-dark)}
  .btn.sm{height:34px;padding:0 11px;font-size:13px;border-radius:9px}
  .help{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;color:var(--ink2);line-height:1.5}
  .help .i{margin-top:1px;color:var(--muted)}
  .link{display:inline-flex;align-items:center;gap:4px;border:0;background:transparent;padding:0;font-size:12.5px;font-weight:700;color:var(--accent-dark);cursor:pointer}
  .link:hover{text-decoration:underline}
  .model-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px dashed var(--line)}
  .model-row:first-of-type{border-top:0;padding-top:0}
  .model-row .meta{flex:1;min-width:0}
  .model-row .meta .k{font-size:12.5px;font-weight:700;color:var(--ink2)}
  .model-row .meta .v{font-size:14px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .picker{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 11px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);font-size:13.5px;font-weight:600;cursor:pointer;max-width:320px}
  .picker:hover{border-color:var(--ink2)}
  .picker .val{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .num{width:96px;height:40px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);text-align:center;font-family:var(--font-mono);font-size:14px;color:var(--ink);outline:none}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .note{display:flex;gap:10px;padding:13px 15px;border-radius:12px;background:var(--sun-soft);color:var(--sun-ink);font-size:12.5px;line-height:1.5}
  .note .i{margin-top:1px;flex:none}
  .empty{padding:60px 30px;text-align:center;color:var(--muted);font-size:14px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
  .chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
  .chip[aria-pressed="true"] .i{color:var(--paper)}
  .model-edit{display:flex;align-items:center;gap:8px}
  .model-edit .input{height:40px;font-family:var(--font-mono);font-size:12.5px}
  .footer-actions{display:flex;gap:9px;padding-top:4px}

  /* general / models / whisper */
  .page-head h1{margin:0;font-family:var(--font-display);font-size:30px;font-weight:800;letter-spacing:-.02em}
  .page-head p{margin:7px 0 0;font-size:14.5px;color:var(--ink2);max-width:620px;line-height:1.55}
  .seg{display:inline-flex;gap:2px;padding:3px;border-radius:12px;border:1px solid var(--line);background:var(--sand);width:fit-content}
  .seg button{height:36px;padding:0 14px;border:0;border-radius:9px;background:transparent;font-size:13.5px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
  .switch{width:46px;height:27px;border-radius:999px;border:1.5px solid var(--ink);background:var(--accent);padding:3px;display:flex;justify-content:flex-end;cursor:pointer;flex:none}
  .switch span{width:18px;height:18px;border-radius:999px;background:var(--surface);border:1.5px solid var(--ink);display:block}
  .switch.off{background:var(--line);justify-content:flex-start}
  .setting-row{display:flex;align-items:center;gap:18px;padding:16px 0;border-top:1px dashed var(--line)}
  .setting-row:first-child{border-top:0;padding-top:0}
  .setting-row .txt{flex:1;min-width:0}
  .setting-row .txt b{display:block;font-size:14px}
  .setting-row .txt span{display:block;font-size:12.5px;color:var(--ink2);margin-top:3px;line-height:1.45}
  .folder{display:flex;align-items:center;gap:10px;height:44px;flex:1;min-width:0;border-radius:11px;border:1px solid var(--line);background:var(--sand);padding:0 13px;font-family:var(--font-mono);font-size:12.5px;color:var(--ink2)}
  .folder span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .about-card{display:flex;align-items:center;gap:16px}
  .about-card .logo{width:64px;height:64px;border-radius:18px;font-size:24px}
  .about-card h2{margin:0;font-family:var(--font-display);font-size:24px;font-weight:800}
  .about-card p{margin:4px 0 0;font-size:13px;color:var(--ink2)}
  .kv{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-top:1px dashed var(--line);font-size:13.5px}
  .kv:first-child{border-top:0;padding-top:0}
  .kv .k{color:var(--ink2)}
  .kv .v{font-weight:600;font-family:var(--font-mono);font-size:12.5px}

  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:999px;border:3px solid var(--paper)}
  ::-webkit-scrollbar-track{background:transparent}

  @media (max-width:900px){
    .shell{grid-template-columns:220px 240px minmax(0,1fr)}
    .detail-inner{padding:24px 24px 50px}
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="mark">R</span>ReelStar</div>
    <span class="crumb">/</span>
    <span class="crumb-title">Pengaturan</span>
    <span class="spacer"></span>
    <div class="theme-seg" role="group" aria-label="Tema">
      <button type="button" data-theme-set="light" aria-pressed="true" title="Terang"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button type="button" data-theme-set="dark" aria-pressed="false" title="Gelap"><svg class="i" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button>
    </div>
    <button class="ghost-btn" type="button"><svg class="i" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7M19 12H5"/></svg>Kembali ke beranda</button>
  </header>

  <div class="shell" id="shell">
    <nav class="sidebar" aria-label="Bagian pengaturan">
      <div class="nav-group">
        <div class="nav-label">Penyedia</div>
        <button class="nav-item" data-section="llm" type="button"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 2v2M15 2v2M9 20v2M15 20v2M2 9h2M2 15h2M20 9h2M20 15h2"/></svg>Cerita (LLM)</button>
        <button class="nav-item" data-section="tts" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/></svg>Suara (TTS)</button>
        <button class="nav-item" data-section="visual" type="button"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>Gambar &amp; video</button>
        <button class="nav-item" data-section="whisper" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M2 12h2M6 8v8M10 5v14M14 8v8M18 10v4M22 12h-2"/></svg>Whisper (lokal)<span class="warn"><svg class="i sm" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg></span></button>
      </div>
      <div class="nav-group">
        <div class="nav-label">Default</div>
        <button class="nav-item" data-section="models" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3"/><path d="M1 14h6M9 8h6M17 16h6"/></svg>Model bawaan</button>
      </div>
      <div class="nav-group">
        <div class="nav-label">Sistem</div>
        <button class="nav-item" data-section="general" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3"/><path d="M1 14h6M9 8h6M17 16h6"/></svg>Umum</button>
        <button class="nav-item" data-section="about" type="button"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>Tentang aplikasi</button>
      </div>
    </nav>

    <aside class="rail" id="rail" aria-label="Daftar penyedia"></aside>
    <main class="detail" id="detail"></main>
  </div>
</div>

<script>
const ICONS = {
  plus:'<path d="M12 5v14M5 12h14"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  alert:'<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/>',
  external:'<path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
  eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',
  trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/>',
  refresh:'<path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/>',
  chevron:'<path d="m6 9 6 6 6-6"/>',
  server:'<rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/>',
  key:'<circle cx="7.5" cy="15.5" r="4.5"/><path d="m11 12 8-8M17 4l3 3M14 7l3 3"/>',
  folder:'<path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9l-.8-1.2A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
  download:'<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>',
  globe:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20Z"/>',
  film:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 8h4M3 16h4M17 8h4M17 16h4"/>'
};

/* ---------------- render ---------------- */
function render(){
  const shell = document.getElementById('shell');
  const hasRail = !!PROVIDERS[state.section];
  shell.classList.toggle('no-rail', !hasRail);

  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.setAttribute('aria-current', btn.dataset.section === state.section ? 'page' : 'false');
    if(btn.dataset.section !== state.section) btn.removeAttribute('aria-current');
  });

  renderRail();

  const detail = document.getElementById('detail');
  if(state.section === 'models') detail.innerHTML = modelsPage();
  else if(state.section === 'general') detail.innerHTML = generalPage();
  else if(state.section === 'whisper') detail.innerHTML = whisperPage();
  else if(state.section === 'about') detail.innerHTML = aboutPage();
  else renderProviderDetail();

  document.querySelectorAll('[data-provider]').forEach(btn => {
    btn.addEventListener('click', () => { state.provider = btn.dataset.provider; render(); });
  });
  document.querySelectorAll('[data-new-provider]').forEach(btn => {
    btn.addEventListener('click', () => { state.provider = '__new'; render(); });
  });
  document.querySelectorAll('[data-cancel-new]').forEach(btn => {
    btn.addEventListener('click', () => { const list = providerList(); state.provider = list[0]?.id; render(); });
  });
  document.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => btn.setAttribute('aria-pressed', btn.getAttribute('aria-pressed') === 'true' ? 'false' : 'true'));
  });
}

document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => {
    state.section = btn.dataset.section;
    const list = PROVIDERS[state.section];
    if(list && list.length) state.provider = list[0].id;
    render();
  });
});

document.querySelectorAll('[data-theme-set]').forEach(btn => {
  btn.addEventListener('click', () => {
    state.theme = btn.dataset.themeSet;
    document.documentElement.dataset.theme = state.theme;
    document.querySelectorAll('[data-theme-set]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.themeSet === state.theme)));
  });
});

render();
</script>
</body>
</html>

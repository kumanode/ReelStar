<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReelStar — Mockup Redesign Alur Short Drama AI</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    /* ReelStar "Kertas & Tinta" Design Tokens scoped to .rs-app */
    .rs-app {
      --rs-paper: #faf7f2;
      --rs-surface: #ffffff;
      --rs-sand: #f3efe8;
      --rs-ink: #1f1d1a;
      --rs-ink-2: #57524a;
      --rs-muted: #6b665e;
      --rs-line: #e6dfd3;
      --rs-line-2: #d4cbbb;
      --rs-line-3: #bfb5a4;
      --rs-accent: #c93a1b;
      --rs-accent-dark: #9e2c13;
      --rs-accent-soft: #fff6f2;
      --rs-sun: #ffc93c;
      --rs-sun-soft: #fff1c7;
      --rs-sun-ink: #6b4e00;
      --rs-ok-soft: #e1f0dd;
      --rs-ok-ink: #25572b;
      --rs-info-soft: #e3ecf8;
      --rs-info-ink: #1e4a7a;
      --rs-bad-soft: #fbe3e1;
      --rs-bad-ink: #8a1f14;
      --rs-draft: #efeae2;
      --rs-shadow: 2px 2px 0 #1f1d1a;
      --rs-shadow-md: 3px 3px 0 #1f1d1a;
      background-color: var(--rs-paper);
      color: var(--rs-ink);
      font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    .rs-app.rs-dark {
      --rs-paper: #141311;
      --rs-surface: #1e1c19;
      --rs-sand: #282521;
      --rs-ink: #f5f2eb;
      --rs-ink-2: #aba296;
      --rs-muted: #8a8276;
      --rs-line: #2f2a24;
      --rs-line-2: #403931;
      --rs-line-3: #5a5145;
      --rs-accent: #e24a24;
      --rs-accent-dark: #b83818;
      --rs-accent-soft: #2d1914;
      --rs-sun: #f6c035;
      --rs-sun-soft: #32270e;
      --rs-sun-ink: #fee085;
      --rs-ok-soft: #152a1a;
      --rs-ok-ink: #76df88;
      --rs-info-soft: #13253b;
      --rs-info-ink: #7eb7f5;
      --rs-bad-soft: #381614;
      --rs-bad-ink: #f87171;
      --rs-draft: #22201c;
      --rs-shadow: 2px 2px 0 #080706;
      --rs-shadow-md: 3px 3px 0 #080706;
    }

    .rs-paper { background-color: var(--rs-paper); }
    .rs-surface { background-color: var(--rs-surface); }
    .rs-sand { background-color: var(--rs-sand); }
    .rs-draft { background-color: var(--rs-draft); }
    .rs-ink { color: var(--rs-ink); }
    .rs-ink-2 { color: var(--rs-ink-2); }
    .rs-muted { color: var(--rs-muted); }
    .rs-border { border-color: var(--rs-line); }
    .rs-border-2 { border-color: var(--rs-line-2); }
    .rs-accent-bg { background-color: var(--rs-accent); color: #ffffff; }
    .rs-accent-bg:hover { background-color: var(--rs-accent-dark); }
    .rs-accent-soft { background-color: var(--rs-accent-soft); color: var(--rs-accent); }
    .rs-sun-soft { background-color: var(--rs-sun-soft); color: var(--rs-sun-ink); }
    .rs-ok-soft { background-color: var(--rs-ok-soft); color: var(--rs-ok-ink); }
    .rs-info-soft { background-color: var(--rs-info-soft); color: var(--rs-info-ink); }
    .rs-bad-soft { background-color: var(--rs-bad-soft); color: var(--rs-bad-ink); }
    .rs-ink-pill { background-color: var(--rs-ink); color: var(--rs-paper); }
    .rs-shadow { box-shadow: var(--rs-shadow); }
    .rs-shadow-md { box-shadow: var(--rs-shadow-md); }

    .rs-display { font-family: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif; letter-spacing: -0.02em; }
    .rs-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-variant-numeric: tabular-nums; }

    .rs-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .rs-scroll::-webkit-scrollbar-track { background: transparent; }
    .rs-scroll::-webkit-scrollbar-thumb { background: var(--rs-line-2); border-radius: 999px; }

    .btn-rs {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 12px;
      transition: all 0.14s ease;
      cursor: pointer;
      user-select: none;
    }
    .btn-rs:active { transform: translateY(1px); }

    .shot-card {
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .shot-card:hover {
      border-color: var(--rs-line-3);
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .anim-in { animation: fadeSlide 0.18s ease-out; }
  </style>
</head>
<body class="m-0 p-0 overflow-hidden bg-[var(--background)]">
  <div id="app" class="rs-app flex flex-col h-screen w-screen overflow-hidden select-none">

    <!-- TOP DEMO GUIDE STRIP -->
    <div class="flex items-center justify-between gap-3 px-4 py-1.5 border-b rs-border rs-sun-soft text-xs shrink-0">
      <div class="flex items-center gap-2 min-w-0">
        <span class="px-2 py-0.5 rounded-md rs-ink-pill font-bold text-[11px] shrink-0">MOCKUP REDESIGN</span>
        <span class="truncate font-medium">Klik antar layar: <strong>Hub Serial</strong> · <strong>Dunia &amp; Pemeran (3 tab)</strong> · <strong>Studio Episode (2 tab: Produksi &amp; Editor)</strong> · coba tombol <strong>Setujui Aset</strong>, <strong>Gambar &amp; Suara</strong>, <strong>Animatic</strong>, dan <strong>Auto-Trim</strong>!</span>
      </div>
      <button onclick="openCompareModal()" class="btn-rs px-2.5 py-1 border rs-border-2 rs-surface rs-ink shrink-0 hover:opacity-90">
        ⇄ Bandingkan Lama vs Baru
      </button>
    </div>

    <!-- STUDIO HEADER -->
    <header class="h-[60px] shrink-0 border-b rs-border rs-surface px-4 flex items-center justify-between gap-3">
      <!-- Left: Back + Title + Aspect + Episode Switcher -->
      <div class="flex items-center gap-2.5 min-w-0">
        <button onclick="showToast('Kembali ke Beranda Serial')" class="size-8 rounded-lg border rs-border rs-sand flex items-center justify-center rs-ink-2 hover:rs-ink" title="Kembali ke Beranda">
          ←
        </button>
        <div class="flex items-center gap-2 min-w-0">
          <span class="rs-display font-bold text-[15px] truncate">Pembalasan Sang Pewaris</span>
          <span class="rs-mono text-[11px] font-semibold px-1.5 py-0.5 rounded border rs-border rs-sand rs-ink-2">9:16</span>
        </div>

        <div class="h-5 w-px bg-[var(--rs-line)] mx-1"></div>

        <!-- Always-available Episode Picker -->
        <div class="relative">
          <select id="headerEpSelect" onchange="switchEpisode(Number(this.value))" class="h-8 pl-2.5 pr-7 rounded-lg border rs-border-2 rs-sand text-xs font-semibold rs-ink cursor-pointer outline-none">
            <option value="1">Ep 1 · Penghinaan di Lobi</option>
            <option value="2" selected>Ep 2 · Rahasia di Ruang Rapat</option>
            <option value="3">Ep 3 · Pengakuan Sang Pewaris</option>
          </select>
        </div>
      </div>

      <!-- Center: ONLY 2 TABS WHEN IN EPISODE VIEW -->
      <div id="episodeTabBar" class="flex items-center gap-1 p-1 rounded-xl border rs-border rs-sand">
        <button id="tabBtnProduction" onclick="setEpisodeTab('production')" class="btn-rs px-3.5 py-1.5 rounded-lg text-xs">
          <span>🎬</span> Produksi <span class="text-[10px] opacity-75 font-normal">(Shot &amp; Storyboard)</span>
        </button>
        <button id="tabBtnEditor" onclick="setEpisodeTab('editor')" class="btn-rs px-3.5 py-1.5 rounded-lg text-xs">
          <span>✂</span> Editor &amp; Rilis
        </button>
      </div>

      <!-- Right: Credits + Task Center + Theme + Export -->
      <div class="flex items-center gap-2 shrink-0">
        <button onclick="showToast('Ep 2 terpakai 140 kr · Total serial 340 kr (Higgsfield)')" class="btn-rs h-8 px-2.5 border rs-border rs-sand rs-ink">
          <span style="color: var(--rs-accent)">◆</span>
          <span class="rs-mono text-xs" id="headerCredits">340 kr</span>
        </button>

        <button id="taskBtn" onclick="openTaskModal()" class="btn-rs h-8 px-2.5 border rs-border rs-surface rs-ink">
          <span id="taskDot" class="size-2 rounded-full" style="background: var(--rs-ok-ink)"></span>
          <span>Tugas</span>
          <span id="taskCount" class="hidden rs-mono text-[10px] px-1.5 rounded-full rs-accent-bg">0</span>
        </button>

        <button onclick="toggleTheme()" class="size-8 rounded-lg border rs-border rs-sand flex items-center justify-center text-sm" title="Ganti Tema Terang / Gelap">
          <span id="themeIcon">🌙</span>
        </button>

        <button onclick="showToast('Membuka dialog Ekspor MP4 + Paket Rilis Ep ' + state.currentEp)" class="btn-rs h-8 px-3 rs-accent-bg rs-shadow">
          ⬇ Ekspor Ep <span id="exportEpNum">2</span>
        </button>
      </div>
    </header>

    <!-- MAIN BODY: SIDEBAR + WORKSPACE -->
    <div class="flex flex-1 min-h-0 overflow-hidden">

      <!-- COLLAPSIBLE SIDEBAR -->
      <aside id="sidebar" class="shrink-0 border-r rs-border rs-surface flex flex-col transition-all duration-200" style="width: 214px;">
        <div class="h-11 px-3 border-b rs-border flex items-center justify-between">
          <span class="sidebar-label rs-display text-[11px] font-bold uppercase tracking-wider rs-muted">Serial</span>
          <button onclick="toggleSidebar()" class="size-7 rounded-lg hover:rs-sand flex items-center justify-center rs-muted text-xs" title="Ciutkan / Buka Sidebar">
            ☰
          </button>
        </div>

        <!-- Top Level Serial Nav -->
        <div class="p-2 flex flex-col gap-1">
          <button id="navHub" onclick="setView('hub')" class="btn-rs w-full justify-start h-9 px-2.5 text-xs">
            <span class="text-sm">🗂</span>
            <span class="sidebar-label">Hub Serial</span>
          </button>
          <button id="navLorebook" onclick="setView('lorebook')" class="btn-rs w-full justify-start h-9 px-2.5 text-xs">
            <span class="text-sm">🎭</span>
            <span class="sidebar-label flex-1 text-left">Dunia &amp; Pemeran</span>
            <span id="sidebarAssetBadge" class="sidebar-label rs-mono text-[10px] px-1.5 py-0.5 rounded-full rs-sun-soft font-bold">2 baru</span>
          </button>
        </div>

        <div class="px-3"><div class="border-t rs-border"></div></div>

        <!-- Episode List -->
        <div class="px-3 pt-3 pb-1 flex items-center justify-between">
          <span class="sidebar-label rs-display text-[11px] font-bold uppercase tracking-wider rs-muted">Episode</span>
          <button onclick="showToast('Episode 4 ditambahkan!')" class="size-6 rounded-md hover:rs-sand flex items-center justify-center rs-muted text-sm" title="Tambah episode">+</button>
        </div>

        <div id="sidebarEpisodes" class="flex-1 overflow-y-auto rs-scroll p-2 flex flex-col gap-1">
          <!-- rendered by JS -->
        </div>

        <!-- Mini footer -->
        <div class="sidebar-label p-2.5 border-t rs-border text-[11px] rs-muted flex items-center justify-between">
          <span>Model Aktif</span>
          <span class="rs-mono font-semibold rs-ink-2">Veo 3.1 · Flux</span>
        </div>
      </aside>

      <!-- MAIN WORKSPACE -->
      <main id="workspace" class="flex-1 min-w-0 flex flex-col overflow-hidden rs-paper">
        <!-- Rendered dynamically by JS -->
      </main>
    </div>
  </div>

  <!-- MODAL CONTAINER -->
  <div id="modalRoot" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4" style="background: rgba(15, 13, 10, 0.55); backdrop-filter: blur(2px);">
    <div id="modalBox" class="rs-app rs-surface border rs-border-2 rounded-2xl rs-shadow-md max-w-2xl w-full max-h-[86vh] flex flex-col overflow-hidden anim-in">
      <!-- content injected by JS -->
    </div>
  </div>

  <!-- TOAST -->
  <div id="toastRoot" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    };

    function showToast(msg, tone = 'info') {
      const root = document.getElementById('toastRoot');
      const el = document.createElement('div');
      const toneCls = tone === 'ok' ? 'rs-ok-soft' : tone === 'warn' ? 'rs-sun-soft' : 'rs-surface rs-ink';
      el.className = `pointer-events-auto px-3.5 py-2.5 rounded-xl border rs-border-2 rs-shadow text-xs font-semibold flex items-center gap-2 anim-in ${toneCls}`;
      el.innerHTML = `<span>${tone === 'ok' ? '✓' : tone === 'warn' ? '⚡' : 'ℹ'}</span><span>${msg}</span>`;
      root.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.25s';
        setTimeout(() => el.remove(), 260);
      }, 2800);
    }

    function toggleTheme() {
      state.dark = !state.dark;
      document.getElementById('app').classList.toggle('rs-dark', state.dark);
      document.getElementById('modalBox').classList.toggle('rs-dark', state.dark);
      document.getElementById('themeIcon').textContent = state.dark ? '☀' : '🌙';
    }

    function toggleSidebar(force) {
      state.sidebarCollapsed = typeof force === 'boolean' ? force : !state.sidebarCollapsed;
      const sb = document.getElementById('sidebar');
      sb.style.width = state.sidebarCollapsed ? '52px' : '214px';
      sb.querySelectorAll('.sidebar-label').forEach(el => {
        el.style.display = state.sidebarCollapsed ? 'none' : '';
      });
    }

    function setView(v) {
      state.view = v;
      if (v !== 'episode' && state.sidebarCollapsed) toggleSidebar(false);
      renderAll();
    }

    function setEpisodeTab(tab) {
      state.view = 'episode';
      state.episodeTab = tab;
      // Auto-collapse sidebar in Editor for full width, restore in Produksi
      toggleSidebar(tab === 'editor');
      renderAll();
    }

              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                ${state.cast.map(c => `
                  <div class="rounded-2xl border rs-border rs-surface p-4 flex gap-4">

      state.cast.forEach(c => {

        c.variants.forEach(v => v.status = 'current');

      state.world.forEach(w => w.status = 'current');
      state.newAssetsApproved = true;
      state.shots[3].imgStatus = 'missing';
      state.shots[3].tags = ['@Pak Hendra', '@Satria / Seragam Satpam', '@Ruang Rapat VIP'];
      state.shots[3].refs = ['Lembar: Pak Hendra ✓', 'Lembar: Ruang Rapat VIP ✓'];
      state.creditsUsed += 60;
      renderAll();
      showToast('Semua lembar referensi selesai berantai (Karakter → Varian → Lokasi)!', 'ok');
    }

      const selCount = state.selectedShotIds.size;

      const visibleShots = state.shots.filter(s => {
        if (state.statusFilter === 'missing') return s.imgStatus !== 'current' || s.vidStatus !== 'current';

                <span>${missingVidCount > 0 ? `Buat Video (${missingVidCount})` : 'Video Lengkap ✓'}</span>

      if (state.expandedShotIds.has(id)) state.expandedShotIds.delete(id);
      else state.expandedShotIds.add(id);
      renderAll();
    }

    function toggleSelectShot(id) {
      if (state.selectedShotIds.has(id)) state.selectedShotIds.delete(id);
      else state.selectedShotIds.add(id);
      renderAll();
    }

    function toggleSelectAllShots() {
      if (state.selectedShotIds.size === state.shots.length) state.selectedShotIds.clear();
      else state.shots.forEach(s => state.selectedShotIds.add(s.id));
      renderAll();
    }

    function approveInlineAssets() {
      generateAllMissingSheets();
    }

    function simulateWriteShots() {
      showToast('Menyusun shot + otomatis menulis prompt visual (1 alur tanpa klik terpisah)...', 'warn');
      setTimeout(() => showToast('4 shot & prompt visual siap diproduksi!', 'ok'), 900);
    }

    function generateSingleImage(id) {
      const s = state.shots.find(x => x.id === id);
      if (!s) return;
      if (s.imgStatus === 'needs_sheet') {
        approveInlineAssets();
      }
      s.imgStatus = 'current';
      state.creditsUsed += 15;
      renderAll();
      showToast(`Gambar Shot ${s.num} selesai dibuat!`, 'ok');
    }

    function generateSingleVideo(id) {
      const s = state.shots.find(x => x.id === id);
      if (!s) return;
      if (s.imgStatus !== 'current') {
        showToast(`Buat gambar Shot ${s.num} dulu sebelum membuat videonya.`, 'warn');
        return;
      }
      s.vidStatus = 'current';
      state.creditsUsed += 60;
      renderAll();
      showToast(`Video AI Shot ${s.num} selesai dibuat!`, 'ok');
    }

    function generateSingleTts(id) {
      const s = state.shots.find(x => x.id === id);
      if (!s) return;
      state.ttsDone = true;
      renderAll();
      showToast(`Suara TTS Monolog Batin Shot ${s.num} selesai direkam!`, 'ok');
    }

    function runSmartBatch(kind, cost, onlySelected = false) {
      closeModal();
      const targetIds = onlySelected ? new Set(state.selectedShotIds) : null;
      state.activeTasks = 2;
      renderAll();
      const msg = kind === 'image'
        ? 'Menjalankan Generate Gambar Storyboard...'
        : kind === 'video'
          ? 'Menjalankan Generate Video AI + Ekstraksi Audio Whisper...'
          : 'Merekam suara TTS Monolog Batin + sinkron Whisper...';
      showToast(msg, 'warn');
      setTimeout(() => {
        if (kind === 'image') {
          state.shots.forEach(s => {
            if (!targetIds || targetIds.has(s.id)) {
              if (s.imgStatus === 'needs_sheet') {
                state.newAssetsApproved = true;
                state.cast.forEach(c => { c.sheet = 'current'; c.variants.forEach(v => v.status = 'current'); });
                state.world.forEach(w => w.status = 'current');
              }
              s.imgStatus = 'current';
              s.tags = s.tags.map(t => t.replace(' (Baru)', ''));
            }
          });
        } else if (kind === 'video') {
          state.shots.forEach(s => {
            if ((!targetIds || targetIds.has(s.id)) && s.imgStatus === 'current') {
              s.vidStatus = 'current';
            }
          });
          state.autoTrimmed = true;
        } else {
          state.ttsDone = true;
        }
        if (onlySelected) state.selectedShotIds.clear();
        state.creditsUsed += cost;
        state.activeTasks = 0;
        renderAll();
        showToast(
          kind === 'image'
            ? 'Gambar selesai dibuat! Kamu bisa cek di "Putar Animatic" dulu sebelum lanjut ke Video AI.'
            : kind === 'video'
              ? 'Video AI selesai + otomatis di-trim! Siap dipoles di tab Editor & Rilis.'
              : 'Suara TTS Monolog Batin selesai direkam & sinkron caption!',
          'ok'
        );
      }, 950);
    }
